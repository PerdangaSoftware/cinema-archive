name: Sync Cinema Archive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      ids:
        description: 'Comma-separated IMDb Const IDs for Watchlist'
        required: false
        default: ''
      watched_ids:
        description: 'Comma-separated IMDb Const IDs for Watched'
        required: false
        default: ''
      curated_json:
        description: 'JSON string of curated lists'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run synchronization
        env:
          INPUT_IDS: ${{ github.event.inputs.ids }}
          INPUT_WATCHED_IDS: ${{ github.event.inputs.watched_ids }}
          INPUT_CURATED_JSON: ${{ github.event.inputs.curated_json }}
        run: |
          python sync.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync watchlist, ratings and curated cinema archive" && git push)
