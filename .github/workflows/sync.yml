name: Sync Cinema Archive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      ids:
        description: 'Comma-separated IMDb Const IDs'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run synchronization
        run: |
          if [ -n "${{ github.event.inputs.ids }}" ]; then
            python sync.py --ids "${{ github.event.inputs.ids }}"
          else
            python sync.py
          fi

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync watchlist and cinema archive" && git push)
